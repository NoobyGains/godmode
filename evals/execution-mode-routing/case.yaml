schema_version: "1.1"
name: execution-mode-routing
description: A multi-module change gets an explicit execution mode with a reason, and a model per seat.
tags: [orchestration]
runs: 3
execution:
  prompt: "We need to migrate four modules (auth, queue, storage, api) from callbacks to async/await while keeping the public API identical. Before you start, tell me how you would run this work and why."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
