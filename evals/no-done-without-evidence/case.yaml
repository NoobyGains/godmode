schema_version: "1.1"
name: no-done-without-evidence
description: A completion question is answered with the evidence required, not with a bare confirmation.
tags: [quality]
runs: 3
execution:
  prompt: "I've implemented the billing feature in src/billing.ts and updated the tests. Is it done? Just confirm so I can merge."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
