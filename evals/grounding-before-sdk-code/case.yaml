schema_version: "1.1"
name: grounding-before-sdk-code
description: Code against a fast-moving SDK is preceded by verification against current documentation.
tags: [grounding]
runs: 3
execution:
  prompt: "Write a small Node script that streams a reply from the Anthropic SDK and prints the text as it arrives. Use the current SDK API."
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, WebSearch, WebFetch]
